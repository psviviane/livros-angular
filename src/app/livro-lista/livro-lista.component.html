<main class='container mt-4'>
    <h1>Catálogo de Livros</h1>

    <table class="tabela-livros">
      <thead>
        <tr>
          <th>Título</th>
          <th>Resumo</th>
          <th>Editora</th>
          <th>Autores</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let livro of livros">
          <td>
            <div class="titulo-acoes">
              <span>{{ livro.titulo }}</span>

              <button class="btn-excluir" (click)="excluir(livro.codLivro)">
                Excluir
              </button>
            </div>
          </td>

          <td>{{ livro.resumo }}</td>

          <td>{{ obterNome(livro.codEditora) }}</td>

          <td>
            <ul>
              <li *ngFor="let autor of livro.autores">
                {{ autor }}
              </li>
            </ul>
          </td>
        </tr>
      </tbody>
    </table>
</main>
